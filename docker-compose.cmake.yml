services:
  test:
    image: cppservicelib-build
    build:
      context: .
      dockerfile: Dockerfile.cmake
      extra_hosts:
        - "host.docker.internal:host-gateway"
      args:
        DEPENDENCY_DOCKER_REGISTRY: ${DEPENDENCY_DOCKER_REGISTRY:-docker.io}
        DEPENDENCY_APT_UBUNTU_ARCHIVE_URL: ${DEPENDENCY_APT_UBUNTU_ARCHIVE_URL:-}
        DEPENDENCY_APT_UBUNTU_SECURITY_URL: ${DEPENDENCY_APT_UBUNTU_SECURITY_URL:-}
        DEPENDENCY_APT_UBUNTU_PORTS_URL: ${DEPENDENCY_APT_UBUNTU_PORTS_URL:-}
        DEPENDENCY_CONAN_REMOTE_URL: ${DEPENDENCY_CONAN_REMOTE_URL:-}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
        PIP_TRUSTED_HOST: ${PIP_TRUSTED_HOST:-}
      additional_contexts:
        userver-source: ${USERVER_SOURCE_CONTEXT:-https://github.com/userver-framework/userver.git#c9f77729c0edce7e423def2d4a4450aa7fc9d259}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    working_dir: /workspace
    environment:
      CCACHE_DIR: /ccache
      CCACHE_BASEDIR: /workspace
      CCACHE_COMPILERCHECK: content
      CCACHE_MAXSIZE: ${CCACHE_MAXSIZE:-20G}
      DEPENDENCY_CONAN_REMOTE_URL: ${DEPENDENCY_CONAN_REMOTE_URL:-}
      PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
      PIP_TRUSTED_HOST: ${PIP_TRUSTED_HOST:-}
      GIT_CONFIG_COUNT: ${GIT_CONFIG_COUNT:-0}
      GIT_CONFIG_KEY_0: ${GIT_CONFIG_KEY_0:-}
      GIT_CONFIG_VALUE_0: ${GIT_CONFIG_VALUE_0:-}
      GIT_CONFIG_KEY_1: ${GIT_CONFIG_KEY_1:-}
      GIT_CONFIG_VALUE_1: ${GIT_CONFIG_VALUE_1:-}
    volumes:
      - .:/workspace
      - cppservicelib-build:/workspace/build
      - cppservicelib-ccache:/ccache
      - ${DEPENDENCY_CONAN_HOME:-cppservicelib-conan2}:/conan
    command:
      - /bin/bash
      - -lc
      - >-
        ./scripts/run_with_progress.sh "Conan Debug install" ./scripts/conan-install.sh Debug /workspace/build-conan/debug
        && conan_toolchain="$$(find /workspace/build-conan/debug -type f -name conan_toolchain.cmake -print -quit)"
        && test -n "$$conan_toolchain"
        && ./scripts/run_with_progress.sh "Debug configure" cmake --fresh --preset docker -DCMAKE_TOOLCHAIN_FILE="$$conan_toolchain" $${CMAKE_CONFIGURE_EXTRA_ARGS:-}
        && ./scripts/run_with_progress.sh "Debug build" cmake --build --preset docker
        && ./scripts/run_with_progress.sh "Test suite" ctest --preset docker

volumes:
  cppservicelib-build:
  cppservicelib-ccache:
  cppservicelib-conan2:
